iece" data-piece="topNote"></div><div class="piece field-labels mini-label editable-piece" data-piece="fieldLabels"></div><div class="piece owner-label mini-label editable-piece" data-piece="ownerLabel"></div><div class="piece odo-label mini-label editable-piece" data-piece="odoLabel"></div><div class="piece notice-label mini-label editable-piece" data-piece="noticeLabel"></div><div class="piece lien-label mini-label editable-piece" data-piece="lienLabel"></div><div class="piece release-label mini-label editable-piece" data-piece="releaseLabel"></div><div class="piece footer-label mini-label editable-piece" data-piece="footerLabel"></div><div class="piece vin editable-piece" data-piece="vin"></div><div class="piece year editable-piece" data-piece="year"></div><div class="piece make editable-piece" data-piece="make"></div><div class="piece model editable-piece" data-piece="model"></div><div class="piece body editable-piece" data-piece="body"></div><div class="piece title-no editable-piece" data-piece="titleNo"></div><div class="piece plate editable-piece" data-piece="plate"></div><div class="piece fuel editable-piece" data-piece="fuel"></div><div class="piece usage editable-piece" data-piece="usage">USE: VEHICLE</div><div class="piece issued editable-piece" data-piece="issued"></div><div class="piece owner editable-piece" data-piece="owner"></div><div class="piece odometer editable-piece" data-piece="odometer"></div><div class="piece notice editable-piece" data-piece="notice"></div><div class="piece barcode editable-piece" data-piece="barcode"></div><div class="piece lien editable-piece" data-piece="lien"></div><div class="piece release editable-piece" data-piece="release"></div><div class="piece control editable-piece" data-piece="control"></div>

<script>
const doc=document.getElementById("doc");
const ids=["watermark","overlayMode","bodyFont","headingFont","docTitle","stateName","titleNo","topNote","fieldLabels","ownerLabel","odoLabel","noticeLabel","lienLabel","releaseLabel","footerLabel","vinStrip","docStrip","actualStrip","odoStrip","lienStripA","lienStripB","lienStripC","lienStripD","vin","year","make","model","body","plate","fuel","issued","odometer","owner","notice","lienholder","release","control"];
const movePositions={};
function val(id){return (document.getElementById(id).value||"").trim();}
function esc(t){return String(t).replace(/[&<>]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[ch]));}
function lines(id){return esc(val(id)).replace(/\n/g,"<br>");}
function setHTML(sel,html){const el=doc.querySelector(sel);if(el)el.innerHTML=html;}
function setText(sel,text){const el=doc.querySelector(sel);if(el)el.textContent=text;}
function update(){
  doc.className=`doc${val("watermark")==="hide"?" hide-watermark":""}`;
  doc.style.setProperty("--body",val("bodyFont")||"'Courier New', monospace");
  doc.style.setProperty("--head",val("headingFont")||"Georgia, serif");
  const showOverlays=val("overlayMode")!=="hide";
  doc.querySelectorAll(".editable-piece").forEach(el=>{el.style.visibility=showOverlays?"visible":"hidden";});
  setText(".doc-title-text",val("docTitle")||"CERTIFICATE OF TITLE");
  setText(".state",val("stateName")||"NEW YORK STATE");
  setText(".title-no",val("titleNo")||"752301W");
  setHTML(".top-note",lines("topNote"));
  setHTML(".field-labels",lines("fieldLabels"));
  setText(".owner-label",val("ownerLabel")||"NAME AND ADDRESS OF SPECIMEN OWNER(S)");
  setText(".odo-label",val("odoLabel")||"ODOMETER READING");
  setText(".notice-label",val("noticeLabel")||"IMPORTANT SPECIMEN NOTICE");
  setText(".lien-label",val("lienLabel")||"LIENHOLDER");
  setText(".release-label",val("releaseLabel")||"TRANSFER RELEASE");
  setText(".footer-label",val("footerLabel")||"DEPARTMENT OF SAMPLE MOTOR VEHICLES");
  setText(".bar-vin",val("vinStrip")||"ABCDEFG12345678912");
  setText(".bar-doc",val("docStrip")||"LIENS");
  setText(".bar-actual",val("actualStrip")||"ACTUAL MILEAGE");
  setText(".bar-odo",val("odoStrip")||"123456");
  setText(".bar-lien-a",val("lienStripA")||"MODELED FINANCE");
  setText(".bar-lien-b",val("lienStripB")||"ACME REGIONAL OPC");
  setText(".bar-lien-c",val("lienStripC")||"UPSTATE BANK");
  setText(".bar-lien-d",val("lienStripD")||"CITY BANK");
  setText(".vin",val("vin")||"ABCDEFG12345678912");
  setText(".year",val("year")||"1996");
  setText(".make",val("make")||"CHEVR");
  setText(".model",val("model")||"3VT");
  setText(".body",val("body")||"2DSP");
  setText(".plate",val("plate")||"ABC12345678912");
  setText(".fuel",val("fuel")||"GAS");
  setText(".issued",val("issued")||"1/09/98");
  setHTML(".owner",lines("owner"));
  setHTML(".odometer",`ODOMETER READING:<br>${esc(val("odometer")||"123456")}<br>ACTUAL MILEAGE`);
  setHTML(".notice",lines("notice"));
  setHTML(".lien",lines("lienholder"));
  setHTML(".release",lines("release"));
  setText(".control",val("control")||"MV-999 (S)");
  applyMovedPositions();
}
function savedMap(){return movePositions.title||(movePositions.title={});}
function applyMovedPositions(){const saved=savedMap();doc.querySelectorAll(".piece").forEach(el=>{el.style.left="";el.style.top="";el.style.right="";el.style.bottom="";const pos=saved[el.dataset.piece];if(pos){el.style.left=`${pos.left}px`;el.style.top=`${pos.top}px`;el.style.right="auto";el.style.bottom="auto";}});}
function makeMoveable(){doc.querySelectorAll(".piece").forEach(el=>{el.addEventListener("pointerdown",event=>{if(event.button!==0)return;event.preventDefault();const docRect=doc.getBoundingClientRect();const r=el.getBoundingClientRect();const startX=event.clientX,startY=event.clientY;const originLeft=r.left-docRect.left,originTop=r.top-docRect.top;const saved=savedMap();el.classList.add("is-moving");el.setPointerCapture(event.pointerId);function move(e){const left=originLeft+(e.clientX-startX);const top=originTop+(e.clientY-startY);el.style.left=`${left}px`;el.style.top=`${top}px`;el.style.right="auto";el.style.bottom="auto";saved[el.dataset.piece]={left,top};}function done(){el.classList.remove("is-moving");el.removeEventListener("pointermove",move);el.removeEventListener("pointerup",done);el.removeEventListener("pointercancel",done);}el.addEventListener("pointermove",move);el.addEventListener("pointerup",done);el.addEventListener("pointercancel",done);});});}
ids.forEach(id=>{document.getElementById(id).addEventListener("input",update);document.getElementById(id).addEventListener("change",update);});
async function exportFile(format){await document.fonts.ready;const canvas=await html2canvas(doc,{scale:4,backgroundColor:"#ffffff",useCORS:true});const stamp="car-title-generator";if(format==="pdf"){const{jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:"landscape",unit:"pt",format:"letter"});const pageW=pdf.internal.pageSize.getWidth(),pageH=pdf.internal.pageSize.getHeight();const ratio=Math.min((pageW-54)/canvas.width,(pageH-54)/canvas.height);const w=canvas.width*ratio,h=canvas.height*ratio;pdf.addImage(canvas.toDataURL("image/jpeg",.95),"JPEG",(pageW-w)/2,(pageH-h)/2,w,h);pdf.save(`${stamp}.pdf`);return;}const link=document.createElement("a");const type=format==="jpeg"?"image/jpeg":"image/png";link.href=canvas.toDataURL(type,.95);link.download=`${stamp}.${format==="jpeg"?"jpg":"png"}`;link.click();}
document.querySelectorAll("[data-export]").forEach(btn=>btn.addEventListener("click",()=>requireExportAccess(()=>exportFile(btn.dataset.export))));
makeMoveable();update();
</script>
