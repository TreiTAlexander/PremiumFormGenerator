<script>
const passport=document.getElementById("passport");
const inputIds=["showSpecimen","dataFont","countryTitle","docLabel","sealWord","typeValue","codeValue","docNumber","typeLabel","codeLabel","numberLabel","surnameLabel","givenLabel","nationalityLabel","dobLabel","birthLabel","sexLabel","issueLabel","expiryLabel","authorityLabel","endorseLabel","surname","given","nationality","sex","birthplace","dob","issued","expiry","authority","endorsements","mrzLine1","mrzLine2"];
const moved={};
function val(id){return (document.getElementById(id).value||"").trim();}
function esc(s){return String(s).replace(/[&<>]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[ch]));}
function htmlLines(s){return esc(s).replace(/\n/g,"<br>");}
function render(){
  passport.classList.toggle("hide-specimen",val("showSpecimen")==="hide");
  passport.style.setProperty("--data",val("dataFont")||"'Courier New', monospace");
  passport.querySelectorAll("[data-field]").forEach(el=>{
    const id=el.dataset.field;
    el.innerHTML=htmlLines(val(id));
  });
  document.getElementById("mrz").innerHTML=`${htmlLines(val("mrzLine1"))}<br>${htmlLines(val("mrzLine2"))}`;
  applyMoved();
}
function applyMoved(){
  passport.querySelectorAll(".piece").forEach(el=>{
    el.style.left="";el.style.top="";el.style.right="";el.style.bottom="";
    const pos=moved[el.dataset.piece];
    if(pos){el.style.left=`${pos.left}px`;el.style.top=`${pos.top}px`;el.style.right="auto";el.style.bottom="auto";}
  });
}
function makeMoveable(){
  passport.querySelectorAll(".piece").forEach(el=>{
    el.addEventListener("pointerdown",event=>{
      if(event.button!==0)return;
      event.preventDefault();
      const docRect=passport.getBoundingClientRect();
      const rect=el.getBoundingClientRect();
      const startX=event.clientX,startY=event.clientY;
      const originLeft=rect.left-docRect.left,originTop=rect.top-docRect.top;
      el.classList.add("is-moving");
      el.setPointerCapture(event.pointerId);
      function move(e){
        const left=originLeft+(e.clientX-startX);
        const top=originTop+(e.clientY-startY);
        el.style.left=`${left}px`;el.style.top=`${top}px`;el.style.right="auto";el.style.bottom="auto";
        moved[el.dataset.piece]={left,top};
      }
      function done(){
        el.classList.remove("is-moving");
        el.removeEventListener("pointermove",move);
        el.removeEventListener("pointerup",done);
        el.removeEventListener("pointercancel",done);
      }
      el.addEventListener("pointermove",move);
      el.addEventListener("pointerup",done);
      el.addEventListener("pointercancel",done);
    });
  });
}
document.getElementById("photoInput").addEventListener("change",event=>{
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    const img=document.getElementById("photoThumb");
    img.src=reader.result;img.style.display="block";document.getElementById("photoText").style.display="none";
    document.getElementById("pvPhoto").innerHTML=`<img src="${reader.result}" alt="Specimen portrait">`;
    document.getElementById("pvGhost").innerHTML=`<img src="${reader.result}" alt="Ghost portrait">`;
  };
  reader.readAsDataURL(file);
});
inputIds.forEach(id=>{document.getElementById(id).addEventListener("input",render);document.getElementById(id).addEventListener("change",render);});
async function exportFile(format){
  await document.fonts.ready;
  const canvas=await html2canvas(passport,{scale:3,backgroundColor:"#d8e9f3",useCORS:true});
  const stamp="passport-specimen";
  if(format==="pdf"){
    const{jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:"landscape",unit:"pt",format:"letter"});
    const pageW=pdf.internal.pageSize.getWidth(),pageH=pdf.internal.pageSize.getHeight();
    const ratio=Math.min((pageW-48)/canvas.width,(pageH-48)/canvas.height);
    const w=canvas.width*ratio,h=canvas.height*ratio;
    pdf.addImage(canvas.toDataURL("image/jpeg",.95),"JPEG",(pageW-w)/2,(pageH-h)/2,w,h);
    pdf.save(`${stamp}.pdf`);
    return;
  }
  const link=document.createElement("a");
  const type=format==="jpeg"?"image/jpeg":"image/png";
  link.href=canvas.toDataURL(type,.95);
  link.download=`${stamp}.${format==="jpeg"?"jpg":"png"}`;
  link.click();
}
document.querySelectorAll("[data-export]").forEach(btn=>btn.addEventListener("click",()=>requireExportAccess(()=>exportFile(btn.dataset.export))));
makeMoveable();render();
</script>
</body>
</html>
